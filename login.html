<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساء الخير يا جميل 
</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== الألوان: غيّرها من هنا ===== */
  :root{
    --ink:#0f1236; --paper:#F4F7FA; --line:#D5DDE6; --muted:#566579; --white:#fff; --error:#B3261E;
    --accent:#1F5FBF; --accent-ink:#fff; --accent-strong:#1F5FBF;   /* طالب */
  }
  .page[data-role="school"]{ --accent:#F2B705; --accent-ink:#14213D; --accent-strong:#8A6200; } /* مدرسة */

  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
  .page{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

  /* ----- الفورم ----- */
  .form-side{display:flex;align-items:center;justify-content:center;padding:32px 24px}
  .card{width:100%;max-width:420px}
  h1{font-size:28px;font-weight:700;margin-bottom:4px}
  .sub{color:var(--muted);margin-bottom:24px}

  .roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;border:0;padding:0;margin-bottom:24px}
  .roles legend{font-weight:600;margin-bottom:8px;padding:0}
  .role input{position:absolute;opacity:0;pointer-events:none}
  .role label{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border:2px solid var(--line);
    border-radius:12px;background:var(--white);cursor:pointer;font-weight:600;transition:border-color .15s,background .15s}
  .role svg{width:30px;height:30px;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .role input:checked + label{border-color:var(--accent-strong);background:color-mix(in srgb,var(--accent) 12%,white)}
  .role input:checked + label svg{stroke:var(--accent-strong)}
  .role input:focus-visible + label{outline:3px solid var(--accent-strong);outline-offset:2px}

  .field{margin-bottom:16px}
  .field label{display:block;font-weight:500;margin-bottom:6px}
  .input-wrap{position:relative}
  input[type=text],input[type=password]{width:100%;padding:12px 14px;font:inherit;border:1.5px solid var(--line);border-radius:10px;background:var(--white);color:var(--ink)}
  input[type=text]:focus,input[type=password]:focus{outline:3px solid color-mix(in srgb,var(--accent-strong) 35%,transparent);border-color:var(--accent-strong)}
  input[aria-invalid="true"]{border-color:var(--error)}
  .toggle{position:absolute;inset-block:0;inset-inline-start:6px;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:0 8px;border-radius:8px}
  .toggle:focus-visible{outline:3px solid var(--accent-strong)}
  #password{padding-inline-start:64px}
  .error{color:var(--error);font-size:14px;min-height:20px;margin-top:4px}

  .row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px;font-size:15px}
  a{color:var(--accent-strong);font-weight:600}
  a:focus-visible{outline:3px solid var(--accent-strong);outline-offset:2px;border-radius:4px}

  .submit{width:100%;padding:14px;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:10px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);transition:filter .15s}
  .submit:hover{filter:brightness(.95)}
  .submit:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .submit[disabled]{opacity:.7;cursor:wait}
  .status{margin-top:14px;min-height:24px;font-size:15px;text-align:center}
  .status.ok{color:#1B6B3A}
  .signup{margin-top:20px;text-align:center;color:var(--muted)}

  /* ----- اللوحة الجانبية: الخريطة ----- */
  .map-side{position:relative;background:var(--ink);color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:48px}
  .map-side svg.map{position:absolute;inset:0;width:100%;height:100%}
  .map-side h2{position:relative;font-size:34px;line-height:1.35;max-width:14ch;margin-bottom:10px}
  .map-side p{position:relative;color:#C5D0E0;max-width:34ch}
  .grid-line{stroke:#2A3B5E;stroke-width:1}
  .road{stroke:#3A5183;stroke-width:6;fill:none;stroke-linecap:round}
  .dot{fill:#F2B705}
  .pin{fill:#F2B705}
  .pulse{fill:none;stroke:#F2B705;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.5}}

  @media (max-width:820px){
    .page{grid-template-columns:1fr}
    .map-side{order:-1;padding:24px;min-height:150px}
    .map-side h2{font-size:22px;max-width:none;margin:0}
    .map-side p{display:none}
  }
</style>
</head>
<body>
<main class="page" id="page" data-role="student">

  <section class="form-side">
    <div class="card">
      <h1>مساء الخير</h1>
      <p class="sub" id="subtitle">سجّل دخولك عشان تدوّر على مدرستك أو جامعتك.</p>

      <form id="loginForm" novalidate>
        <fieldset class="roles">
          <legend>أنا</legend>
          <div class="role">
            <input type="radio" name="role" id="role-student" value="student" checked>
            <label for="role-student">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/><path d="M22 9v6"/></svg>
              طالب
            </label>
          </div>
          <div class="role">
            <input type="radio" name="role" id="role-school" value="school">
            <label for="role-school">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12z"/><path d="M9 21v-6h6v6"/><path d="M12 9v.01"/></svg>
              مدرسة
            </label>
          </div>
        </fieldset>

        <div class="field">
          <label for="identifier" id="identifierLabel">رقم الموبايل أو البريد الإلكتروني</label>
          <input type="text" id="identifier" name="identifier" autocomplete="username" inputmode="email" aria-describedby="identifierError">
          <div class="error" id="identifierError" role="alert"></div>
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" aria-describedby="passwordError">
            <button type="button" class="toggle" id="toggle" aria-label="إظهار كلمة المرور">إظهار</button>
          </div>
          <div class="error" id="passwordError" role="alert"></div>
        </div>

        <div class="row">
          <span></span>
          <a href="forgot-password.html">نسيت كلمة المرور؟</a>
        </div>

        <button class="submit" type="submit" id="submitBtn">دخول كطالب</button>
        <div class="status" id="status" aria-live="polite"></div>
      </form>

      <p class="signup">معندكش حساب؟ <a href="register.html" id="signupLink">إنشاء حساب جديد</a></p>
    </div>
  </section>

  <aside class="map-side" aria-hidden="false">
    <svg class="map" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g>
        <line class="grid-line" x1="0" y1="160" x2="600" y2="160"/><line class="grid-line" x1="0" y1="320" x2="600" y2="320"/>
        <line class="grid-line" x1="0" y1="480" x2="600" y2="480"/><line class="grid-line" x1="0" y1="640" x2="600" y2="640"/>
        <line class="grid-line" x1="120" y1="0" x2="120" y2="800"/><line class="grid-line" x1="300" y1="0" x2="300" y2="800"/>
        <line class="grid-line" x1="480" y1="0" x2="480" y2="800"/>
      </g>
      <path class="road" d="M-20 520 C 150 480, 220 300, 420 260 S 580 120, 640 100"/>
      <path class="road" d="M200 820 C 230 640, 330 560, 360 420"/>
      <circle class="dot" cx="150" cy="430" r="6"/><circle class="dot" cx="470" cy="190" r="6"/>
      <circle class="dot" cx="250" cy="610" r="6"/><circle class="dot" cx="520" cy="470" r="6"/>
      <circle class="dot" cx="90" cy="250" r="6"/>
      <circle class="pulse" cx="360" cy="330" r="22"/>
      <path class="pin" d="M360 345c-12-14-18-22-18-31a18 18 0 0 1 36 0c0 9-6 17-18 31z"/>
      <circle cx="360" cy="314" r="6.5" fill="#14213D"/>
    </svg>
    <h2>أقرب مدرسة ليك على بعد ضغطة</h2>
    <p>دوّر بالموقع، قارن الصور والتقييمات، وادفع من نفس التطبيق.</p>
  </aside>

</main>
<script>
  const form = document.getElementById('loginForm') || document.querySelector('form');
  
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const identifierInput = document.querySelector('input[type="text"]') || document.querySelector('input[type="email"]') || document.querySelector('input');
      const passwordInput = document.querySelector('input[type="password"]');

      const identifier = identifierInput ? identifierInput.value : '';
      const password = passwordInput ? passwordInput.value : '';

      const pageElement = document.getElementById('page');
      let role = pageElement ? pageElement.getAttribute('data-role') : 'student';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ role, identifier, password })
        });

        const data = await response.json();
if (response.ok) {
          alert('تم تسجيل الدخول بنجاح! 🚀');
          window.location.href = 'dashboard.html';
        } else {
          alert(data.error || 'بيانات الدخول غير صحيحة');
        }
      } catch (err) {
        console.error(err);
        alert('حدث خطأ في الاتصال بالسيرفر');
      }
    });
  }
</script>
</body>
</html>
