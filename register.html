<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب جديد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; padding: 50px; text-align: center; }
        form { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 300px; text-align: right; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <h2>إنشاء حساب جديد</h2>
    <form id="registerForm">
        <label>الاسم:</label>
        <input type="text" id="name" required>

        <label>البريد الإلكتروني:</label>
        <input type="email" id="email" required>

        <label>رقم الهاتف:</label>
        <input type="text" id="phone">

        <label>كلمة المرور:</label>
        <input type="password" id="password" required>

        <button type="submit">تسجيل</button>
    </form>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password, role: 'student' })
                });

                const data = await response.json();
                if (response.ok) {
                    alert('تم إنشاء الحساب بنجاح 🎉');
                    window.location.href = '/login.html';
                } else {
                    alert(data.error || 'حدث خطأ');
                }
            } catch (err) {
                console.error(err);
                alert('خطأ في الاتصال بالخادم');
            }
        });
    </script>

</body>
</html>
